name: Bitcoin PQC size model tests

on:
  pull_request:
    paths:
      - "experiments/transaction/bitcoin_pqc_size_model.py"
      - "tests/test_bitcoin_pqc_size_model.py"
      - ".github/workflows/bitcoin-pqc-size-model.yml"
  push:
    branches: [main]
    paths:
      - "experiments/transaction/bitcoin_pqc_size_model.py"
      - "tests/test_bitcoin_pqc_size_model.py"
      - ".github/workflows/bitcoin-pqc-size-model.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Run offline transaction model tests
        run: python -m pytest -q tests/test_bitcoin_pqc_size_model.py
